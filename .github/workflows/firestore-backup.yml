# Auto Backup Firestore — รันทุกวัน 02:00 UTC (09:00 ไทย)
# ─────────────────────────────────────────────────────────
# ก่อนใช้งาน ต้องตั้งค่าใน GitHub repo:
# 1. Settings → Secrets and variables → Actions → New repository secret
# 2. เพิ่ม 2 secrets:
#    - FIREBASE_SA_CPU_ERP     = service account JSON ของ cpu-erp
#    - FIREBASE_SA_BOONG       = service account JSON ของ boong-private
#
# วิธีหา service account JSON:
# Firebase Console → ⚙️ Project settings → Service accounts
# → Generate new private key → ดาวน์โหลด .json
# → เปิดไฟล์ copy ทั้งหมด paste เป็น secret value

name: Firestore Daily Backup

on:
  schedule:
    - cron: '0 2 * * *'   # ทุกวัน 02:00 UTC (09:00 Bangkok)
  workflow_dispatch:       # อนุญาตให้ trigger manual ได้

permissions:
  contents: write   # อนุญาตให้ commit + push กลับเข้า repo

jobs:
  backup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # ⚠️ รันทีละ project — กัน race condition ตอน push ขึ้น repo
      matrix:
        project:
          - name: cpu-erp
            secret: FIREBASE_SA_CPU_ERP
          - name: boong-private
            secret: FIREBASE_SA_BOONG

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin

      - name: Write service account
        env:
          SA_JSON: ${{ secrets[matrix.project.secret] }}
        run: printf '%s' "$SA_JSON" > sa.json

      - name: Verify service account JSON
        run: |
          if [ ! -s sa.json ]; then
            echo "❌ sa.json is empty — secret '${{ matrix.project.secret }}' may be missing"
            exit 1
          fi
          node -e "const sa = require('./sa.json'); console.log('✅ Service account for:', sa.project_id);"

      - name: Dump Firestore
        env:
          PROJECT: ${{ matrix.project.name }}
        run: |
          cat > backup.mjs << 'EOF'
          import { initializeApp, cert } from "firebase-admin/app";
          import { getFirestore } from "firebase-admin/firestore";
          import { writeFileSync, mkdirSync } from "node:fs";

          const COLLECTIONS = [
            "users","products","clothing","transactions",
            "customers","suppliers","orders","invoices",
            "statements","settings"
          ];

          import { readFileSync } from "node:fs";
          const sa = JSON.parse(readFileSync("sa.json", "utf8"));
          initializeApp({ credential: cert(sa) });
          const db = getFirestore();

          const out = {
            metadata: {
              version: 1,
              projectId: process.env.PROJECT,
              exportedAt: new Date().toISOString(),
              exportedBy: "github-actions",
            },
            collections: {},
          };

          let total = 0;
          for (const col of COLLECTIONS) {
            const snap = await db.collection(col).get();
            const docs = [];
            snap.forEach(d => docs.push({ _id: d.id, ...d.data() }));
            out.collections[col] = docs;
            total += docs.length;
            console.log(`  ${col}: ${docs.length}`);
          }

          mkdirSync(`backups/${process.env.PROJECT}`, { recursive: true });
          const today = new Date().toISOString().slice(0, 10);
          const path = `backups/${process.env.PROJECT}/${today}.json`;
          writeFileSync(path, JSON.stringify(out, null, 2));
          console.log(`Done: ${total} records → ${path}`);
          EOF
          node backup.mjs

      - name: Remove old backups (keep last 30 days)
        run: |
          cd backups/${{ matrix.project.name }} 2>/dev/null || exit 0
          ls -t *.json 2>/dev/null | tail -n +31 | xargs -r rm -f
          cd ../..

      - name: Clean up sensitive files
        if: always()
        run: rm -f sa.json backup.mjs

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No backup changes to commit"
            exit 0
          fi
          git commit -m "backup: ${{ matrix.project.name }} $(date -u +%Y-%m-%d)"
          # Retry push พร้อม pull --rebase หาก remote เปลี่ยน
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push origin master && { echo "✅ Push success on attempt $i"; exit 0; }
            echo "⏳ Push failed, retrying in 5s... (attempt $i/5)"
            sleep 5
          done
          echo "❌ Push failed after 5 retries"
          exit 1
